[package]
name = "airband-backend"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "HTTP backend and engine supervisor for Frequency Recorder"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util", "fs"] }
tower-http = { version = "0.5", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
tower = { version = "0.4", features = ["util"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
sha2 = "0.10"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
auto-launch = "0.5"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
