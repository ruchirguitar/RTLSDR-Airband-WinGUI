[package]
name = "airband-recorder"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "RTLSDR-Airband recorder for Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
airband-backend = { path = "../backend" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread"] }
