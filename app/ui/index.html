<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frequency Recorder</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffb020" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4.9 19.1a10 10 0 0 1 0-14.2"/><path d="M7.8 16.2a6 6 0 0 1 0-8.4"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4"/><path d="M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>
      Frequency Recorder
    </div>
    <span id="status-pill" class="pill"><span class="dot"></span><span id="status-text">Connecting…</span></span>
    <span id="net-pill" class="pill net hidden"></span>
    <span id="window-text" class="muted"></span>
    <span class="grow"></span>
    <button id="btn-recording" class="btn hidden" type="button"></button>
  </header>

  <div class="body">
    <nav class="nav" aria-label="Main">
      <a href="#/monitor" data-nav="monitor"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>Monitor</span></a>
      <a href="#/recordings" data-nav="recordings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 15v-4M11 15V9M15 15v-6M19 15v-2"/></svg><span>Recordings</span></a>
      <a href="#/nets" data-nav="nets"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Nets</span></a>
      <a href="#/frequency/new" data-nav="frequency"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add frequency</span></a>
      <a href="#/settings" data-nav="settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Settings</span></a>
      <div class="grow"></div>
      <div class="disk" id="disk-box"></div>
    </nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <footer class="player hidden" id="player" aria-label="Player">
    <button class="btn round" id="player-toggle" type="button" aria-label="Play"></button>
    <div class="title" id="player-title"></div>
    <div class="seek" id="player-seek" role="slider" aria-label="Position" tabindex="0"><div class="bar"></div><div class="done" id="player-done"></div><div id="player-marks"></div></div>
    <span class="time" id="player-time"></span>
    <select id="player-speed" aria-label="Speed"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
    <button class="btn ghost icon" id="player-close" type="button" aria-label="Close player"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <audio id="audio" preload="metadata"></audio>
  </footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
